default_language_version:
  python: python3

exclude: ^godot-cpp/

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        exclude: ^godot-cpp/

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        exclude: ^godot-cpp/

  - repo: local
    hooks:
      - id: header-guards
        name: header-guards
        language: python
        entry: python godot-cpp/misc/scripts/header_guards.py
        files: \.h$
        exclude: ^godot-cpp/

      - id: file-format
        name: file-format
        language: python
        entry: python godot-cpp/misc/scripts/file_format.py
        types_or: [text]
        exclude: ^godot-cpp/
